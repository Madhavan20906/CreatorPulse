<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161828"/>
      <stop offset="50%" stop-color="#20243b"/>
      <stop offset="100%" stop-color="#0f111c"/>
    </linearGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#efff85"/>
      <stop offset="100%" stop-color="#d8f66a"/>
    </linearGradient>
    <linearGradient id="pulseGlow" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#d8f66a" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#d8f66a" stop-opacity="1"/>
      <stop offset="100%" stop-color="#72920f" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle container with subtle border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="#373c5c" stroke-width="6"/>

  <!-- Radar / Growth Loop concentric rings -->
  <circle cx="256" cy="256" r="180" stroke="#ffffff" stroke-opacity="0.05" stroke-width="3" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="128" stroke="#d8f66a" stroke-opacity="0.15" stroke-width="2"/>

  <!-- Growth Pulse waveform with glow -->
  <path d="M 96 268 H 168 L 204 216 L 244 324 L 284 172 L 324 296 L 352 248 L 372 268 H 416" 
        stroke="url(#pulseGlow)" 
        stroke-width="28" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- High-contrast sharp foreground line -->
  <path d="M 96 268 H 168 L 204 216 L 244 324 L 284 172 L 324 296 L 352 248 L 372 268 H 416" 
        stroke="url(#limeGrad)" 
        stroke-width="20" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Apex Peak Energy Orb -->
  <circle cx="284" cy="172" r="14" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="284" cy="172" r="9" fill="#efff85"/>
</svg>

